name: Validate timeline Skill
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test-and-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CJK fonts and PNG backend
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Render example assets
        run: python scripts/timeline_events.py examples/us-china-trade-war-verified.json --output dist/us-china-trade-war --format both
      - name: Check outputs
        run: |
          test -s dist/us-china-trade-war.svg
          test -s dist/us-china-trade-war.png
          test -s dist/us-china-trade-war.sources.md
      - uses: actions/upload-artifact@v4
        with:
          name: timeline-example
          path: dist/
