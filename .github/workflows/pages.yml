name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: timeline-events-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate checked-in page and inventory
        run: |
          python scripts/verify_skill_sync.py
          python scripts/check_site.py
          python -m unittest discover -s tests -v
      - name: Check HTML regeneration is deterministic
        run: |
          python scripts/render_html.py skills/timeline-events/examples/reference-image-transcription.json --reference-transcription --output /tmp/reference-timeline.html --site-url ../../index.html
          cmp /tmp/reference-timeline.html docs/events/us-china-trade-war/index.html
          python scripts/render_html.py data/eight-crises-1949-2009.json --output /tmp/eight-crises.html --site-url ../../index.html
          cmp /tmp/eight-crises.html docs/events/eight-crises/index.html
      - name: Configure Pages (repository must enable GitHub Actions as Pages source)
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
